syntax = "proto3";

package kv;

option go_package = "./proto/kv";

service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Forward(ForwardRequest) returns (ForwardResponse);
}

service RaftService {
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(SnapshotRequest) returns (SnapshotResponse);
}

message GetRequest { string key = 1; }
message GetResponse { string value = 1; bool found = 2; string error = 3; }
message SetRequest { string key = 1; string value = 2; int64 ttl_seconds = 3; }
message SetResponse { bool success = 1; string error = 2; }
message DeleteRequest { string key = 1; }
message DeleteResponse { bool success = 1; string error = 2; }
message ForwardRequest { string op = 1; string key = 2; string value = 3; int64 ttl_seconds = 4; }
message ForwardResponse { bool success = 1; string value = 2; string error = 3; }

message VoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}
message VoteResponse { int64 term = 1; bool vote_granted = 2; }

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}
message AppendEntriesResponse { int64 term = 1; bool success = 2; int64 conflict_index = 3; int64 conflict_term = 4; }

message LogEntry { int64 index = 1; int64 term = 2; string op = 3; string key = 4; string value = 5; int64 ttl_seconds = 6; }

message SnapshotRequest { int64 term = 1; string leader_id = 2; int64 last_included_index = 3; int64 last_included_term = 4; bytes data = 5; }
message SnapshotResponse { int64 term = 1; }
